name: Sync to Gitee

on:
  # Legacy mirror: confirm the destination and renew GITEE_TOKEN before running.
  # Keep manual-only so an optional mirror cannot fail every website push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git push "https://rainyjensen:${GITEE_TOKEN}@gitee.com/rainyjensen/zack-zhang1031.github.io.git" main
