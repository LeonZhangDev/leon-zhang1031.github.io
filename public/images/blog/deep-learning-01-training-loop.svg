<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="title desc"><title id="title">一个 batch 怎样更新参数</title><desc id="desc">训练阶段根据 loss 更新参数；验证阶段使用 eval 与禁用梯度，两者职责不同。流程为概念图，不是实验结果。</desc><rect width="760" height="592" rx="16" fill="#f4f6fa"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="32" y="48" font-size="27" font-weight="700" fill="#152339">一个 batch 怎样更新参数</text><text x="32" y="79" font-size="17" fill="#54657d">张坤 · 技术图解 / 概念示意</text><rect x="32" y="108" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="139" fill="#152339" font-size="23" font-weight="700">1. 输入与标签</text><text x="56" y="170" fill="#384b68" font-size="20">X: [B, 2]；y: [B]</text><path d="M380 192v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="218" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="249" fill="#152339" font-size="23" font-weight="700">2. 模型前向</text><text x="56" y="280" fill="#384b68" font-size="20">logits: [B, 2]</text><path d="M380 302v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="328" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="359" fill="#152339" font-size="23" font-weight="700">3. 交叉熵</text><text x="56" y="390" fill="#384b68" font-size="20">loss: 标量</text><path d="M380 412v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="438" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="469" fill="#152339" font-size="23" font-weight="700">4. 反向与更新</text><text x="56" y="500" fill="#384b68" font-size="20">梯度 → optimizer.step</text><text x="32" y="571" font-size="16" fill="#54657d">原始图源：scripts/blog/figure-specs.mjs · 可点击查看原尺寸</text></g></svg>
