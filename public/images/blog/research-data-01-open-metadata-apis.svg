<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="title desc"><title id="title">科研元数据的来源链</title><desc id="desc">同一论文的多个来源可能冲突。统一字段不意味着抹掉来源差异。</desc><rect width="760" height="592" rx="16" fill="#f4f6fa"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="32" y="48" font-size="27" font-weight="700" fill="#152339">科研元数据的来源链</text><text x="32" y="79" font-size="17" fill="#54657d">张坤 · 技术图解 / 概念示意</text><rect x="32" y="108" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="139" fill="#152339" font-size="23" font-weight="700">1. 官方数据源</text><text x="56" y="170" fill="#384b68" font-size="20">原始响应 + 请求条件</text><path d="M380 192v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="218" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="249" fill="#152339" font-size="23" font-weight="700">2. 归一化</text><text x="56" y="280" fill="#384b68" font-size="20">DOI、标题、日期</text><path d="M380 302v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="328" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="359" fill="#152339" font-size="23" font-weight="700">3. 合并与冲突</text><text x="56" y="390" fill="#384b68" font-size="20">保留来源与缺失</text><path d="M380 412v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="438" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="469" fill="#152339" font-size="23" font-weight="700">4. M1 数据集</text><text x="56" y="500" fill="#384b68" font-size="20">版本、质量报告</text><text x="32" y="571" font-size="16" fill="#54657d">原始图源：scripts/blog/figure-specs.mjs · 可点击查看原尺寸</text></g></svg>
