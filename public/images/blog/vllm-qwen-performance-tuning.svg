<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="title desc"><title id="title">一次请求的延迟拆分</title><desc id="desc">这是一张测量边界图，不是性能曲线。客户端与服务端计时边界不同，比较前必须统一。</desc><rect width="760" height="592" rx="16" fill="#f4f6fa"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="32" y="48" font-size="27" font-weight="700" fill="#152339">一次请求的延迟拆分</text><text x="32" y="79" font-size="17" fill="#54657d">张坤 · 技术图解 / 概念示意</text><rect x="32" y="108" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="139" fill="#152339" font-size="23" font-weight="700">1. 到达与排队</text><text x="56" y="170" fill="#384b68" font-size="20">并发与负载模型</text><path d="M380 192v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="218" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="249" fill="#152339" font-size="23" font-weight="700">2. Prefill</text><text x="56" y="280" fill="#384b68" font-size="20">处理输入 token</text><path d="M380 302v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="328" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="359" fill="#152339" font-size="23" font-weight="700">3. 首 token</text><text x="56" y="390" fill="#384b68" font-size="20">TTFT 的测量边界</text><path d="M380 412v22m-6-6 6 6 6-6" fill="none" stroke="#b45309" stroke-width="3"/><rect x="32" y="438" width="696" height="82" rx="12" fill="#ffffff" stroke="#ccd4e2"/><text x="56" y="469" fill="#152339" font-size="23" font-weight="700">4. Decode 与完成</text><text x="56" y="500" fill="#384b68" font-size="20">TPOT、总时延、成功率</text><text x="32" y="571" font-size="16" fill="#54657d">原始图源：scripts/blog/figure-specs.mjs · 可点击查看原尺寸</text></g></svg>
