<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23325e48'/%3E%3Ctext x='8' y='24' fill='white' font-size='25' font-family='serif'%3ER%3C/text%3E%3C/svg%3E"><title>私人工作台 · 登录</title><link rel="stylesheet" href="./assets/style.css"><script src="./assets/app.js" defer></script></head>
<body data-page="login"><main class="login-shell"><div class="wordmark"><span class="mark">R</span> RESEARCH DESK <span id="access-tag" class="local-tag">PRIVATE</span></div>
<div class="login-grid"><section class="login-intro"><p class="eyebrow">PRIVATE WORKSPACE / 01</p><h1>一个问题，<br>一份有依据的方案。</h1><p class="intro-copy">把目标交给研究助手，查看它如何搜集资料、核实缺口，再整理成可审阅的建议。</p><div class="quiet-rule"></div><p id="login-runtime-notice" class="small-copy">正在读取运行模式。搜索和网页为合成资料，不代表实时调研。</p></section>
<section class="login-card"><span class="section-number">PRIVATE ACCESS</span><h2 id="auth-title">进入私人工作台</h2><p id="auth-description">正在检查本地访问状态…</p><form id="auth-form"><label for="password">访问密码</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="256" required placeholder="请输入访问密码"><label id="confirm-label" for="confirm-password" hidden>再次输入密码</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="256" hidden><button id="auth-submit" class="primary" type="submit" disabled>继续</button><p id="auth-error" role="alert" class="error"></p></form><p class="small-copy">密码只保存为加盐哈希。会话空闲 30 分钟后过期。</p></section></div><footer>PRIVATE BY DESIGN <span id="access-location">密码保护</span></footer></main></body></html>
