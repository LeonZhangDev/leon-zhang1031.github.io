<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 310px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1f2329;
            display: flex;
            align-items: center;
        }
        .title::before {
            content: "📄";
            margin-right: 8px;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 13px;
        }
        .active {
            background-color: #e8f5e8;
            color: #1f883d;
            border: 1px solid #d1f2d1;
        }
        .inactive {
            background-color: #fff2f2;
            color: #d73a49;
            border: 1px solid #ffd6d6;
        }
        .description {
            font-size: 12px;
            color: #656d76;
            line-height: 1.5;
        }
        select, button { font: inherit; }
        select { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #d0d7de; border-radius: 6px; }
        button { padding: 7px 10px; margin-bottom: 8px; cursor: pointer; }
        label { display: block; margin: 8px 0; font-size: 13px; }
        #selection-status { white-space: pre-line; }
        #mode-feedback { min-height: 36px; margin: 0 0 12px; }
        .feature-list {
            margin-top: 12px;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            font-size: 12px;
            color: #656d76;
        }
        .feature-item::before {
            content: "✓";
            color: #1f883d;
            font-weight: bold;
            margin-right: 6px;
        }
        .usage-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e1e4e8;
        }
        .usage-title {
            font-size: 13px;
            font-weight: 600;
            color: #1f2329;
            margin-bottom: 8px;
        }
        .usage-item {
            font-size: 12px;
            color: #656d76;
            margin-bottom: 4px;
            padding-left: 8px;
        }
    </style>
</head>
<body>
    <div class="title">文档复制助手</div>
    <p id="site-name" class="description"></p>
    <div id="status" class="status inactive" role="status" aria-live="polite">
        正在检测当前页面…
    </div>
    <button id="check-status" type="button">重新检测</button>
    <button id="toggle-page" type="button" disabled>启用当前页面增强</button>
    <label><input id="remember-site" type="checkbox" disabled> 记住本站，自动启用（需授权）</label>
    <label><input id="enable-paste" type="checkbox" disabled> 恢复粘贴（默认关闭）</label>
    <label for="copy-mode">默认复制模式</label>
    <select id="copy-mode" disabled>
        <option value="rich">保留格式</option>
        <option value="plain">纯文本</option>
        <option value="markdown">Markdown</option>
    </select>
    <p id="mode-feedback" class="description" aria-live="polite">默认用于 Ctrl+C / Cmd+C 和双击复制。</p>
    <button id="prepare-images" type="button" disabled>准备选区图文复制</button>
    <p id="selection-status" class="description" aria-live="polite"></p>
    
    <div class="description">
        飞书与腾讯文字文档支持格式转换；其他网页按需启用。关闭增强后恢复页面原有行为。
    </div>
    
    <div class="feature-list">
        <div class="feature-item">强制启用文本选择</div>
        <div class="feature-item">恢复右键复制菜单</div>
        <div class="feature-item">支持 Ctrl+C 快捷键</div>
        <div class="feature-item">保留格式 / 纯文本 / Markdown</div>
        <div class="feature-item">双击快速复制</div>
    </div>
    
    <div class="usage-section">
        <div class="usage-title">使用方法：</div>
        <div class="usage-item">• 选中文字后按 Ctrl+C</div>
        <div class="usage-item">• 选中文字后右键复制</div>
        <div class="usage-item">• 双击文字直接复制</div>
    </div>
    
    <p class="description">“已连接”表示页面脚本已就绪。粘贴后的格式取决于目标应用；图片引用仍受原文档权限影响。</p>
    <script src="copy-platforms.js"></script>
    <script src="popup.js"></script>
</body>
</html>
